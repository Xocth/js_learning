<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUIZ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

    <div class="intro_page"> <!-- Intro page -->

        <div class="screen active" id="start_screen">
            <h1>Quiz Start!</h1>
            <p>Test your knowledge!</p>
            
            <button id="start_btn">Start Now</button>

         </div>

    </div>

    <div class="screen" id="quiz_screen"> <!-- Quiz screen -->

        <h2 id="question_text">Question here</h2>
        <div class="quiz_info">
        
        <p>
            Question <span id="current_question">1</span> of <span id="total_questions">5</span>
        </p>

        <p>Score: <span id="current_score">0</span></p>


        </div>

        <div id="answer_container" class="answer_container">
            <!-- Answer buttons will be inserted with Js code -->
        </div> 

        <div class="progress_bar">
            <div class="progress" id="progress"></div>
            <overflow></overflow>

        </div>



        </div>

    <div id="result_screen" class="screen"> <!-- Result screen -->
        
        <h1>Results!</h1>
        <div class="result_info">
            <p>Scored <span id="final_score">0</span> out of <span id="max_score">5</span></p>
        </div>

        <div id="result_message"> Good job! </div>

        <button id="restart_btn">Restart Quiz</button>
    </div>

    </div>
    

    <script src="script.js"></script>
 </body>

</html>
