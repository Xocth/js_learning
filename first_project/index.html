<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUIZ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

    <div class="intro-page"> <!-- Intro page -->

        <div class="screen active" id="start_screen">
            <h1>Quiz Start!</h1>
            <p>Test your knowledge!</p>
            
            <button id="start-btn">Start Now</button>

         </div>

    </div>

    <div class="screen" id="quiz-screen"> <!-- Quiz screen -->

        <h2 id="question-text">Question here</h2>
        <div class="quiz-info"
        
        <p>
            Question <span id="current-question">1</span> of <span id="total-questions">5</span>
        </p>

        <p>Score: <span id="current-score">0</span></p>


        </div>

        <div id="answer-container" class="answer-container">
            <!-- Answer buttons will be inserted with Js code -->
        </div> 

        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>



        <div id="result-screen" class="screen"> <!-- Result screen -->
            
            <h1>Results!</h1>
            <div class="result-info">
                <p>Scored <span id="final-score">0</span> out of <span id="max-score">5</span></p>
            </div>

            <div id="result-message"> Good job! </div>

        </div>

         <button id="restart-btn">Restart Quiz</button>


    </div>

    </div>
    
</body>
</html>
